name: stardew_scncp_tools
description: A modern Flutter-based sprite editor for Stardew Valley with Content Patcher support
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Desktop support
  window_manager: ^0.5.1
  file_selector: ^1.0.3
  file_selector_windows: ^0.9.3+2
  file_selector_macos: ^0.9.3+2
  file_selector_linux: ^0.9.3+2

  # Image processing
  image: ^4.1.3

  # UI components
  provider: ^6.0.5
  flutter_riverpod: ^2.4.4
  cupertino_icons: ^1.0.2

  # Syntax highlighting
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0

  # JSON handling
  json_annotation: ^4.8.1

  # Utilities
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true